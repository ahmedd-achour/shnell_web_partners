<div class="container-fluid p-3">

  <!-- Compact Dashboard Cards + Pie Chart -->
  <div class="row g-3 mb-3 align-items-center">

    <div class="col-lg-2 col-md-4 col-sm-6">
      <div class="stat-card shadow-sm bg-success text-white text-center py-2">
        <i class="fas fa-truck-moving fa-lg mb-1"></i>
        <div>{{ totalDriversCount }}</div>
        <small>Total</small>
      </div>
    </div>

    <div class="col-lg-2 col-md-4 col-sm-6">
      <div class="stat-card shadow-sm bg-warning text-dark text-center py-2">
        <i class="fas fa-bolt fa-lg mb-1"></i>
        <div>{{ readyDriversCount }}</div>
        <small>Ready</small>
      </div>
    </div>

    <div class="col-lg-2 col-md-4 col-sm-6">
      <div class="stat-card shadow-sm bg-info text-white text-center py-2">
        <i class="fas fa-route fa-lg mb-1"></i>
        <div>{{ inMissionCount }}</div>
        <small>In Mission</small>
      </div>
    </div>

    <div class="col-lg-2 col-md-4 col-sm-6">
      <div class="stat-card shadow-sm bg-danger text-white text-center py-2">
        <i class="fas fa-user-slash fa-lg mb-1"></i>
        <div>{{ offlineDriversCount }}</div>
        <small>Offline</small>
      </div>
    </div>

    <!-- Pie chart compact -->
    <div class="col-lg-4 col-md-8 col-sm-12">
      <canvas id="driverStatusChart" height="120"></canvas>
    </div>

  </div>

  <!-- Drivers Table -->
  <div class="card shadow-lg drivers-card">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fas fa-globe me-2"></i>Online Drivers</h5>
      <div class="input-group" style="width:250px;">
        <input type="text" class="form-control form-control-sm" placeholder="Search drivers..."
          [(ngModel)]="searchTerm" (input)="filterDrivers()" />
        <span class="input-group-text"><i class="fas fa-search"></i></span>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height:400px; overflow-y:auto;">
        <table class="table table-striped table-hover align-middle text-center mb-0 table-sm">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Vehicle</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let driver of filteredDrivers">
              <td>{{ driver.name }}</td>
              <td>{{ driver.email }}</td>
              <td>{{ driver.phone }}</td>
              <td><img [src]="'../img/' + driver.vehicleType + '.png'" height="35" width="80" (error)="onImgError($event)"></td>
<td>
  <a [routerLink]="'driver-details/'+ driver.id" class="btn btn-sm btn-primary">View</a>
</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
